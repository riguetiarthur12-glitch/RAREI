<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Administração - R.A.R.E.I
    </title>


    <style>

        body {

            margin: 0;

            background: #eeeeee;

            font-family: Arial, sans-serif;

        }


        header {

            background: #91d7e8;

            padding: 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        header h1 {

            margin: 0;

            color: white;

        }


        header a {

            color: #111;

            font-weight: bold;

            text-decoration: none;

            background: white;

            padding: 10px 18px;

        }


        main {

            padding: 30px;

        }


        .grade {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        250px,
                        1fr
                    )
                );

            gap: 20px;

        }


        .item {

            background: white;

            padding: 12px;

            border: 2px solid #111;

        }


        img,
        video {

            width: 100%;

            max-height: 250px;

            object-fit: contain;

            background: #111;

        }


        button {

            width: 100%;

            margin-top: 10px;

            padding: 10px;

            border: 0;

            background: #d93434;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #b22222;

        }


        h2 {

            margin-top: 40px;

        }

    </style>

</head>


<body>


<header>

    <h1>
        R.A.R.E.I ADMIN
    </h1>


    <a href="/admin/sair">

        Sair

    </a>

</header>


<main>


<h2>
    Fotos
</h2>


<div class="grade">


{% for arquivo in fotos %}


<div class="item">


<a
    href="{{ url_for('mostrar_foto', filename=arquivo) }}"
    target="_blank"
>

<img
    src="{{ url_for('mostrar_foto', filename=arquivo) }}"
>

</a>


<form
    method="POST"
    action="{{ url_for('excluir_foto', filename=arquivo) }}"
    onsubmit="return confirm('Excluir esta foto?');"
>

<button type="submit">

    Excluir foto

</button>

</form>


</div>


{% else %}


<p>
    Nenhuma foto.
</p>


{% endfor %}


</div>



<h2>
    Vídeos
</h2>


<div class="grade">


{% for arquivo in videos %}


<div class="item">


<video controls>

<source
    src="{{ url_for('mostrar_video', filename=arquivo) }}"
>

</video>


<form
    method="POST"
    action="{{ url_for('excluir_video', filename=arquivo) }}"
    onsubmit="return confirm('Excluir este vídeo?');"
>

<button type="submit">

    Excluir vídeo

</button>

</form>


</div>


{% else %}


<p>
    Nenhum vídeo.
</p>


{% endfor %}


</div>


</main>


</body>

</html>
